<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap CSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style1.CSS">
</head>
<body>
    <div class="container">
        <h2>Form Demo</h2>
        <form>
            <div class="mb-3">
               <label class="form-label" for="Email">Email</label>
               <input type="text" class="form-control" placeholder="Email" id="Email" />
            </div>
            <div class="mb-3">
                <label class="form-label" for="Password">Password</label>
               <input type="Password" class="form-control" placeholder="Password" id="Password" />
            </div>
            <!-- <div class="bm-3">
                  <label class="form-label" for="Address">Address</label>
                  <input type="text" class="form-control-sm" placeholder="Address" id="Address" />
            </div> -->
                <div class="mb-3">
                    <select class="form-select">
                    <option selected>Choose your city!</option>
                    <option value="1">Delhi</option>
                    <option value="2">Rewari</option>
                    <option value="3">Rampur</option>
                </select>
            </div>
                <div class="mb-3 form-check">
                <label for="Agreebs" class="form-check-label">Agree</label>
                <input type="checkbox" id="Agreebs" class="form-check-input">
            </div>
             <div class="mb-3 form-check">
                <label for="Radiobs" class="form-check-label">Yes/No</label>
                <input type="radio" id="Radiobs" class="form-check-input">
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
