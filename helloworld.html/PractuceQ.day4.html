<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form HTML</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form action="/sever">
        <div>
            <input type="text" placeholder="First name" name="fname">
        <input type="text" placeholder="Last name" name="lname">
        </div>
        <div>
            <label for="gender">Please select gender</label>
            <select name="gender" id="gemder">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>
       <div>
         Do you agree to all terms of service?
         <input type="checkbox" id="tos_agree" name="tos_agree">
         <label for="tos_agree">Yes,I agree</label>
        </div>
        <button>Registration</button>

    </form>
</body>
</html>
